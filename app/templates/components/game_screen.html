<div id="game-container">
<div class="game-shell">
    <div class="game-frame">
    <header class="game-header">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="btn-secondary">
            Menu
        </button>
        <div class="brand-mini">
            <strong>Soc Ops</strong>
            <span>Coffee House</span>
        </div>
        <div class="header-spacer"></div>
    </header>

    <p class="helper-copy">
        Tap a tile whenever you meet someone who matches that prompt.
    </p>

    {% if session.has_bingo %}
    <div class="bingo-banner">
        House Special served: BINGO is ready!
    </div>
    {% endif %}

    <div class="board-wrap">
        {% include "components/bingo_board.html" %}
    </div>
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
