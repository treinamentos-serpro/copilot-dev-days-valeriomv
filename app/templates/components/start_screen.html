<div id="game-container">
<div class="page-shell">
    <div class="coffee-panel text-center">
        <span class="brand-kicker stagger-1">Fresh Round</span>
        <h1 class="brand-title stagger-1">Soc Ops Coffee House</h1>
        <p class="brand-subtitle stagger-2">A warm social bingo blend for your team break.</p>

        <div class="rules-card stagger-2">
            <h2>House Rules</h2>
            <ul class="rules-list">
                <li>Find someone who matches each menu prompt.</li>
                <li>Tap the tile to mark your discovery.</li>
                <li>Serve 5 in a row to brew a BINGO.</li>
            </ul>
        </div>

        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="btn-primary stagger-3">
            Brew a New Round
        </button>
    </div>
</div>
</div>
